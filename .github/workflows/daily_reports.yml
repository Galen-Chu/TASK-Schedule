name: Daily Reports

on:
  schedule:
    # 22:30 UTC = 06:30 Asia/Taipei (next day) — covers the earliest daily slot.
    - cron: '30 22 * * *'
    # 01:00 UTC on the 2nd = 09:00 Asia/Taipei — monthly macro digest (Financial only).
    - cron: '0 1 2 * *'
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      date:
        description: 'Report date YYYY-MM-DD (blank = today)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'Financial_Intelligence/**'
      - 'Global_Intelligence/**'
      - 'Spiritual_Intelligence/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/daily_reports.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: daily-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-droid-fallback fonts-liberation
          # Sanity-check the path the font resolver expects
          ls -l /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify font resolution
        run: python main.py --fonts

      - name: Build all reports
        env:
          DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS="all"
          if [ -n "$DATE" ]; then ARGS="all --date $DATE"; fi
          python main.py $ARGS --output-dir output

      - name: Build monthly macro digest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python main.py macro --output-dir output

      - name: Show generated files
        run: |
          echo "::group::Output tree"
          find output -type f | sort
          echo "::endgroup::"
          # Verify each PDF exists and report page counts (daily=5, macro=1)
          python - <<'PY'
          import glob, re, os, sys
          pdfs = sorted(glob.glob("output/*.pdf"))
          assert pdfs, "no PDF produced!"
          for p in pdfs:
              raw = open(p, "rb").read()
              pages = len(re.findall(rb"/Type\s*/Page[^s]", raw))
              is_macro = "Macro_Digest" in p
              expect = 1 if is_macro else 5
              print(f"{pages} pages  {os.path.getsize(p):>8} bytes  {os.path.basename(p)}")
              assert pages == expect, f"{p} expected {expect} pages, got {pages}"
          print(f"\nOK: {len(pdfs)} PDF(s), page counts verified.")
          PY

      - name: Upload PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 14
          if-no-files-found: warn
