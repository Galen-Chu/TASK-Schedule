name: Daily Reports

# NOTE: GitHub skips the push event entirely when the push's HEAD commit
# message contains the [skip ci] marker — and the marker is scanned in the
# title AND the body: a commit that merely quotes it in an explanation gets
# skipped too (that is exactly what silenced 997ce8b). Keep corpus-accumulate
# commits off the tip of feature merges, and never write the literal token
# in a commit message you want validated.

on:
  schedule:
    # 22:18 UTC = 06:18 Asia/Taipei (next day). Slot history: born at 22:30
    # (06:30) — delayed 13–21 min daily, dropped entirely 2026-08-26; moved to
    # 23:30 (07:30) — first slot sat 7.5 h in the queue (landed
    # 2026-08-28T07:00Z) in the backlog behind the Aug 24–27 Actions incidents.
    # Both failures sat on the :30 minute, and 23:xx also leans against the
    # 00:00-UTC cron flood (the platform's most congested minute). 22:18
    # clears both zones with ~100 min of midnight buffer. The omen: 0+6+1+8 =
    # 15 — I Ching hexagram 15, Modesty, the only hexagram with all six lines
    # auspicious — reducing to numerology 6 (rhythm, devoted service). A daily
    # job could ask for no better.
    - cron: '18 22 * * *'
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      date:
        description: 'Report date YYYY-MM-DD (blank = today)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'Financial_Intelligence/**'
      - 'Global_Intelligence/**'
      - 'Spiritual_Intelligence/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/daily_reports.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: write   # schedule run commits the accumulated retrieval corpus back

concurrency:
  group: daily-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # test runner (not in runtime requirements)

      - name: Provision CJK font (static Noto TC instances)
        run: |
          # Static Regular/Bold instances of Noto Sans TC — identical rendering
          # to local builds. (The variable font's default instance is Thin,
          # which made small white badge text near-invisible; apt Droid renders
          # differently from local, too.) Falls back to apt Droid on failure.
          python scripts/fetch_fonts.py || (
            sudo apt-get update
            sudo apt-get install -y fonts-droid-fallback fonts-liberation
          )
          ls -l fonts/ || true

      - name: Verify font resolution
        run: python main.py --fonts

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Provision GCP service-account key (optional)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # Writes the service-account JSON only when the GCP_SA_KEY secret is
          # set; otherwise Drive upload stays a safe no-op.
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"
            echo "GCP service-account key provisioned."
            # Diagnostic: show whether the target folder lives in a Shared
            # Drive (driveId set) — SAs can only own files there.
            # NOTE: GITHUB_ENV exports only apply to LATER steps, so pass the
            # key path directly here instead of reading GOOGLE_APPLICATION_CREDENTIALS.
            DRIVE_FOLDER_ID="$DRIVE_FOLDER_ID" \
              SA_KEY_PATH="$RUNNER_TEMP/sa-key.json" python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          creds = service_account.Credentials.from_service_account_file(
              os.environ["SA_KEY_PATH"],
              scopes=["https://www.googleapis.com/auth/drive.file"])
          svc = build("drive", "v3", credentials=creds, cache_discovery=False)
          fid = os.environ.get("DRIVE_FOLDER_ID", "")
          try:
              meta = svc.files().get(fileId=fid, supportsAllDrives=True,
                                     fields="id,name,driveId,mimeType").execute()
              where = "SHARED DRIVE" if meta.get("driveId") else "MY DRIVE (SA cannot own files here!)"
              print(f"FOLDER_META: {json.dumps(meta, ensure_ascii=False)} -> {where}")
          except Exception as e:
              print(f"FOLDER_META_ERR: {e}")
          PY
          else
            echo "GCP_SA_KEY not set — Drive upload will be skipped."
          fi

      - name: Build all reports
        env:
          DATE: ${{ github.event.inputs.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          ARGS="all"
          if [ -n "$DATE" ]; then ARGS="all --date $DATE"; fi
          python main.py $ARGS --output-dir output

      - name: Show generated files
        run: |
          echo "::group::Output tree"
          find output -type f | sort
          echo "::endgroup::"
          # Verify each PDF exists and report page counts
          # financial=7 (P1 Market Intelligence + 6 quant), global=7 (P1 trend + 6 domains), spiritual=7 (5 systems + I Ching + Tarot), macro=1
          python - <<'PY'
          import glob, re, os, sys
          pdfs = sorted(glob.glob("output/*.pdf"))
          assert pdfs, "no PDF produced!"
          for p in pdfs:
              raw = open(p, "rb").read()
              pages = len(re.findall(rb"/Type\s*/Page[^s]", raw))
              is_macro = "Macro_Digest" in p
              is_fin = ("Financial" in p) and not is_macro
              is_global = "Global" in p
              expect = 1 if is_macro else (7 if is_fin else (7 if is_global else 7))
              print(f"{pages} pages  {os.path.getsize(p):>8} bytes  {os.path.basename(p)}")
              assert pages == expect, f"{p} expected {expect} pages, got {pages}"
          print(f"\nOK: {len(pdfs)} PDF(s), page counts verified.")
          PY

      - name: Upload PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 14
          if-no-files-found: warn

      # The retrieval corpus (data/retrieval/*.jsonl) must persist across the
      # ephemeral runner, so the scheduled run commits it back to the repo.
      # data/** is NOT in the push paths-filter, so this commit won't re-trigger.
      - name: Accumulate retrieval corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no corpus changes"
          else
            git commit -m "chore(retrieval): accumulate corpus [skip ci]"
            git push
          fi
